<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Python Notes: Packaging, Safety, Observability, and Typing</title>
  <style>
    /* Design tokens */
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --sidebar-bg: #e9eee8;
      --paper: #ffffff;
      --ink: #1d2522;
      --soft-ink: #53615b;
      --muted: #738078;
      --line: #d8dfd8;
      --strong-line: #b7c1b8;
      --accent: #0f6f73;
      --accent-dark: #0a4f53;
      --accent-ink: #ffffff;
      --code-bg: #17201d;
      --code-ink: #f4fbf7;
      --green: #d9f4df;
      --green-line: #2f9b59;
      --yellow: #fff1a8;
      --yellow-line: #be8d00;
      --red: #ffd9d6;
      --red-line: #c84c43;
      --blue-soft: #e5f3f4;
      --blue-line: #9ccbd0;
      --radius: 8px;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* Base styles */
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      text-rendering: optimizeLegibility;
    }
    a {
      color: var(--accent-dark);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.95em;
    }
    :not(pre) > code {
      background: #edf2ef;
      border: 1px solid #dbe3dd;
      border-radius: 5px;
      padding: 0.08rem 0.28rem;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    pre {
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      padding: 16px;
      border-radius: var(--radius);
      margin: 12px 0 0;
      line-height: 1.55;
      max-width: 100%;
    }

    pre code {
      background: transparent;
      border: 0;
      padding: 0;
      color: inherit;
      white-space: pre;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--strong-line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 7px;
      min-height: 36px;
      padding: 7px 11px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(15, 111, 115, 0.26);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    /* Layout and sidebar */
    .layout {
      display: grid;
      grid-template-columns: minmax(220px, 286px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .layout > * {
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      padding: 20px 18px;
    }

    .toc-title {
      font-size: 20px;
      line-height: 1.2;
      margin: 0 0 14px;
    }

    .toc a {
      border-bottom: 1px solid rgba(83, 97, 91, 0.18);
      color: var(--ink);
      display: block;
      font-size: 14px;
      line-height: 1.35;
      padding: 8px 0;
      text-decoration: none;
    }

    .toc a:hover {
      color: var(--accent-dark);
    }

    .content {
      width: min(100%, 980px);
      padding: 36px 38px 52px;
      margin: 0 auto;
      min-width: 0;
    }

    /* Article content */
    .hero {
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      padding: 6px 0 28px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3.35rem);
      line-height: 1.06;
      letter-spacing: 0;
      margin: 0 0 14px;
      max-width: 880px;
    }

    .meta {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      font-size: 14px;
      gap: 8px;
    }

    .pill {
      background: #eef2ef;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--soft-ink);
      padding: 4px 10px;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 34px 0 26px;
      scroll-margin-top: 22px;
    }

    .section:first-child {
      border-top: 0;
    }

    .section h2 {
      font-size: clamp(1.55rem, 2.7vw, 2.15rem);
      line-height: 1.18;
      letter-spacing: 0;
      margin: 0 0 18px;
    }

    .section h3 {
      color: var(--soft-ink);
      font-size: 1.05rem;
      line-height: 1.3;
      letter-spacing: 0;
      margin: 26px 0 10px;
    }

    .article-body {
      font-size: 1.02rem;
      max-width: 780px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .article-list,
    .review-list,
    .mistake-list {
      margin: 0;
      padding-left: 1.25rem;
    }

    .article-list li,
    .review-list li,
    .mistake-list li {
      margin: 0.58rem 0;
      padding-left: 0.2rem;
    }

    .summary-list {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      list-style: none;
      margin: 0;
      padding: 14px 18px;
    }

    .summary-list li {
      border-bottom: 1px solid rgba(83, 97, 91, 0.12);
      margin: 0;
      padding: 0.72rem 0;
    }

    .summary-list li:first-child {
      padding-top: 0;
    }

    .summary-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .callout-grid {
      display: grid;
      gap: 14px;
      margin: 12px 0 4px;
    }

    .callout {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 0;
      padding: 15px 17px;
      min-width: 0;
    }

    .callout.command {
      background: #fafbfc;
    }

    .callout.warning {
      background: #fffdf0;
      border-color: #e5d58a;
    }

    .callout h4 {
      font-size: 0.98rem;
      line-height: 1.3;
      margin: 0 0 6px;
    }

    .callout p {
      margin: 0;
    }

    .source-tag {
      color: var(--muted);
      display: inline-flex;
      flex-wrap: wrap;
      font-size: 13px;
      gap: 4px;
      margin-top: 12px;
    }

    /* Highlight toolbar and review panel */
    .selection-toolbar {
      align-items: center;
      background: rgba(29, 37, 34, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      box-shadow: 0 12px 26px rgba(20, 26, 24, 0.28);
      color: #ffffff;
      display: flex;
      gap: 6px;
      left: 50%;
      padding: 6px;
      position: fixed;
      top: 12px;
      z-index: 30;
    }

    .selection-toolbar[hidden] {
      display: none;
    }

    .selection-toolbar button {
      border: 0;
      border-radius: 999px;
      color: #14201b;
      min-height: 30px;
      padding: 5px 10px;
    }

    .selection-toolbar .select-green {
      background: var(--green);
    }

    .selection-toolbar .select-yellow {
      background: var(--yellow);
    }

    .selection-toolbar .select-red {
      background: var(--red);
    }

    .selection-toolbar .select-clear {
      background: #ffffff;
      color: #24302b;
    }

    .reader-highlight {
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      padding: 0.05em 0.12em;
    }

    .reader-highlight-green {
      background: var(--green);
      box-shadow: inset 0 -2px 0 var(--green-line);
    }

    .reader-highlight-yellow {
      background: var(--yellow);
      box-shadow: inset 0 -2px 0 var(--yellow-line);
    }

    .reader-highlight-red {
      background: var(--red);
      box-shadow: inset 0 -2px 0 var(--red-line);
    }

    .reader-highlight-focus {
      animation: highlight-pulse 1.4s ease-out;
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @keyframes highlight-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(15, 111, 115, 0.45);
      }

      100% {
        box-shadow: 0 0 0 12px rgba(15, 111, 115, 0);
      }
    }

    .highlights-tab {
      align-items: center;
      background: var(--accent);
      border-color: var(--accent);
      border-radius: 8px 0 0 8px;
      box-shadow: 0 10px 24px rgba(20, 26, 24, 0.18);
      color: var(--accent-ink);
      display: inline-flex;
      font-weight: 700;
      justify-content: center;
      min-height: 44px;
      padding: 9px 12px;
      position: fixed;
      right: 0;
      top: 44%;
      transform: translateY(-50%);
      z-index: 28;
      writing-mode: vertical-rl;
    }

    .highlights-panel {
      background: var(--paper);
      border-left: 1px solid var(--line);
      box-shadow: -18px 0 42px rgba(20, 26, 24, 0.15);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: min(380px, 92vw);
      position: fixed;
      right: 0;
      top: 0;
      transform: translateX(100%);
      transition: transform 180ms ease;
      width: 360px;
      z-index: 29;
    }

    body.highlights-panel-open .highlights-panel {
      transform: translateX(0);
    }

    body.highlights-panel-open .highlights-tab {
      opacity: 0;
      pointer-events: none;
    }

    .highlights-panel-header {
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 18px;
    }

    .highlights-panel-title {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .highlights-panel-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 0;
    }

    .highlights-close {
      align-items: center;
      display: inline-flex;
      justify-content: center;
      min-height: 34px;
      padding: 5px 10px;
    }

    .highlights-panel-body {
      overflow: auto;
      padding: 14px 18px 20px;
    }

    .json-connect {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--soft-ink);
      margin: 0 0 14px;
      padding: 12px;
    }

    .json-connect p {
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 9px;
    }

    .json-connect button {
      min-height: 34px;
      padding: 6px 10px;
    }

    .json-connect strong {
      color: var(--ink);
      font-weight: 700;
    }

    .highlights-empty {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--soft-ink);
      margin: 0;
      padding: 14px;
    }

    .highlight-group {
      margin: 0 0 18px;
    }

    .highlight-group h3 {
      align-items: center;
      color: var(--ink);
      display: flex;
      font-size: 0.95rem;
      gap: 8px;
      margin: 0 0 8px;
    }

    .highlight-group-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .highlight-list {
      display: grid;
      gap: 8px;
    }

    .highlight-card {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      cursor: pointer;
      padding: 10px 11px;
      text-align: left;
      width: 100%;
    }

    .highlight-card:hover {
      border-color: var(--accent);
    }

    .highlight-card.green {
      background: #f2fbf4;
      border-color: rgba(47, 155, 89, 0.35);
    }

    .highlight-card.yellow {
      background: #fffbea;
      border-color: rgba(190, 141, 0, 0.35);
    }

    .highlight-card.red {
      background: #fff4f3;
      border-color: rgba(200, 76, 67, 0.35);
    }

    .highlight-card-text {
      display: block;
      font-size: 0.92rem;
      line-height: 1.42;
    }

    .highlight-card-source {
      color: var(--muted);
      display: block;
      font-size: 12px;
      line-height: 1.3;
      margin-top: 7px;
    }

    /* Test and exercise controls */
    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 22px;
    }

    .exercise-note {
      color: var(--soft-ink);
      margin: -4px 0 14px;
      max-width: 760px;
    }

    .test-group {
      border-top: 1px solid var(--line);
      margin-top: 24px;
      padding-top: 18px;
    }

    .test-group h3 {
      color: var(--ink);
      margin-top: 0;
    }

    .shuffle-section {
      margin-bottom: 10px;
    }

    .question {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 12px 0;
      padding: 16px;
      min-width: 0;
    }

    .question[data-result="correct"] {
      background: #fbfffc;
      border-color: var(--green-line);
      box-shadow: 0 0 0 1px rgba(47, 155, 89, 0.18);
    }

    .question[data-result="wrong"] {
      background: #fffafa;
      border-color: var(--red-line);
      box-shadow: 0 0 0 1px rgba(200, 76, 67, 0.18);
    }

    .question[data-result="review"] {
      background: #fffdf4;
      border-color: var(--yellow-line);
      box-shadow: 0 0 0 1px rgba(190, 141, 0, 0.18);
    }

    .q-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .question p {
      margin: 0 0 12px;
    }

    .option {
      display: block;
      margin: 8px 0;
    }

    .option input {
      margin-right: 6px;
    }

    .answer-toggle {
      margin-top: 12px;
    }

    .answer-panel {
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      border-radius: var(--radius);
      margin-top: 10px;
      padding: 12px;
    }

    .answer-panel[hidden] {
      display: none;
    }

    .manual-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    textarea,
    input[type="text"] {
      background: #ffffff;
      border: 1px solid var(--strong-line);
      border-radius: var(--radius);
      padding: 10px;
      width: 100%;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .stats {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-top: 20px;
    }

    .stat {
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1.2;
    }

    .wrong-list {
      margin-top: 16px;
    }

    .sources-list {
      padding-left: 1.3rem;
    }

    .sources-list li {
      margin: 0.65rem 0;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive styles */
    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-bottom: 1px solid var(--line);
        border-right: 0;
        height: auto;
        position: relative;
      }

      .toc {
        display: grid;
        gap: 0 14px;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }

      .content {
        padding: 24px 18px 40px;
      }

      .hero {
        padding-top: 0;
      }

      .selection-toolbar {
        border-radius: var(--radius);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 360px);
      }

      .highlights-tab {
        top: auto;
        bottom: 18px;
        min-height: 40px;
      }

      .highlights-panel {
        max-width: 94vw;
        width: 94vw;
      }
    }

    /* Print styles */
    @media print {
      .sidebar,
      .selection-toolbar,
      .highlights-tab,
      .highlights-panel,
      .test-controls,
      .answer-toggle,
      .answer-panel,
      .manual-controls {
        display: none !important;
      }

      .layout {
        display: block;
      }

      body[data-print-wrong="true"] .section:not(#test-section),
      body[data-print-wrong="true"] .question:not([data-result="wrong"]) {
        display: none !important;
      }

      body {
        background: #ffffff;
      }

      .content {
        width: 100%;
        padding: 0;
      }

      .section,
      .hero,
      .question {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 class="toc-title" id="toc-heading">Index</h2>
      <nav class="toc" id="toc" aria-labelledby="toc-heading"></nav>
    </aside>
    <main class="content" aria-labelledby="page-title">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title"></h1>
        <div class="meta" id="page-meta"></div>
      </section>
      <div id="notes-root"></div>
    </main>
  </div>
  <div
    class="selection-toolbar"
    id="selection-toolbar"
    role="toolbar"
    aria-label="Text highlight tools"
    hidden
  >
    <button type="button" class="select-green" data-highlight-action="green">Green</button>
    <button type="button" class="select-yellow" data-highlight-action="yellow">Yellow</button>
    <button type="button" class="select-red" data-highlight-action="red">Red</button>
    <button type="button" class="select-clear" data-highlight-action="clear">Clear</button>
  </div>
  <button
    type="button"
    class="highlights-tab"
    id="highlights-tab"
    aria-controls="highlights-panel"
    aria-expanded="false"
  >
    Highlights
  </button>
  <aside
    class="highlights-panel"
    id="highlights-panel"
    aria-label="Highlights"
    aria-hidden="true"
  >
    <div class="highlights-panel-header">
      <div>
        <h2 class="highlights-panel-title">Highlights</h2>
        <p
          class="highlights-panel-subtitle"
          id="highlights-panel-count"
          role="status"
          aria-live="polite"
        >
          0 saved
        </p>
      </div>
      <button
        type="button"
        class="highlights-close"
        id="highlights-close"
        aria-controls="highlights-panel"
        aria-label="Close highlights panel"
      >
        Close
      </button>
    </div>
    <div class="json-connect" id="json-connect-panel" hidden>
      <p id="json-connect-message" role="status" aria-live="polite">
        Connect the notes JSON once so highlight changes can save into it.
      </p>
      <button type="button" id="json-connect-button">Connect JSON</button>
    </div>
    <div class="highlights-panel-body" id="highlights-panel-body"></div>
  </aside>
  <script type="application/json" id="notion-notes-data">{"metadata":{"title":"Production Python Notes: Packaging, Safety, Observability, and Typing","sourceTitle":"Sample rough Notion notes","sourceUrl":"","factCheckMode":"cited verification","generatedAt":"2026-06-07","outputName":"2605_25_31","htmlFileName":"2605_25_31.html","jsonFileName":"2605_25_31.json"},"summary":["The page is mostly about moving Python code from rough scripts toward production-grade packages: clean package layout, `pyproject.toml`, console scripts, quality gates, CI, migrations, observability, deployment safety, and tests.","`pyproject.toml` is the central modern configuration file for Python packaging and many developer tools. The important tables are `[build-system]`, `[project]`, and `[tool.*]`.","A production service needs runtime safety before it needs polish: strict config loading, preflight checks, health/doctor commands, structured logging, and clear error classes.","Database migrations protect deployments by making schema changes explicit, versioned, testable, and reversible where possible.","Prometheus normally uses a pull model: exporters expose metrics and Prometheus scrapes them. Counters, gauges, histograms, and summaries are different tools for different measurement shapes.","The rough notes had a few important corrections: `grep` comes from `g/re/p` or global/regular expression/print, not point; `TYPE_CHECKING` is false at runtime; mypy checks statically without running code."],"sections":[{"id":"python-packaging-quality","title":"Python Packaging and Quality Gates","items":["`pyproject.toml` is a TOML configuration file used by Python packaging tools and also by tools such as linters, formatters, and type checkers.","`[build-system]` declares the build backend and build-time dependencies needed to build the project. It should be present for modern packages.","`[project]` holds standardized project metadata for many build backends: name, version, dependencies, scripts, authors, and related metadata.","`[tool]` is the namespace for tool-specific configuration, for example `[tool.black]`, `[tool.mypy]`, `[tool.ruff]`, or `[tool.hatch]`.","Console commands should usually be declared in `[project.scripts]` so users can run a command after installing the package.","`check.sh` should be treated as a quality gate: run formatting checks, linting, type checks, tests, coverage, build checks, and smoke tests before packaging or releasing.","Generated package metadata such as `.egg-info/` should usually be ignored unless the project intentionally tracks it."],"examples":[{"title":"Minimal package quality flow","body":"A useful flow is: format check -> lint -> mypy -> tests -> coverage -> wheel build -> install smoke test. This catches style, static, runtime, and packaging failures before release."},{"title":"Console script intent","body":"Instead of telling users to run `python src/app/main.py`, expose a command like `my-service` through `[project.scripts]` so the installed package behaves like a real tool."}],"commands":[{"title":"Count tracked Python lines","body":"Use this for a quick size baseline. It only counts Python files tracked by Git.","code":"git ls-files \"*.py\" | xargs wc -l"},{"title":"Editable development install","body":"Install the package in editable mode with development extras when the project defines them.","code":"python3 -m pip install -e \".[dev]\""}],"mistakes":["Treating `pyproject.toml` as only a packaging file. It often centralizes build, metadata, and tool configuration.","Running tests but skipping package build/install smoke tests. A project can pass tests and still fail after installation.","Putting all tool configuration in arbitrary top-level TOML tables. Tool-specific config belongs under `[tool.*]` unless a standard says otherwise."],"citations":["src-pyproject"]},{"id":"runtime-deployment-safety","title":"Runtime and Deployment Safety","items":["Runtime safety means the service can explain its configuration, detect missing dependencies, report health, and fail with clear errors before hurting users.","A strict config loader should validate required fields, types, defaults, secret references, and invalid combinations at startup.","A preflight command checks whether the service can start safely: config exists, credentials are reachable, database schema is compatible, ports are free, and dependencies are available.","A health command should answer whether the service is alive and ready. A doctor command should give deeper diagnostics for operators.","A daemon is a background process not directly controlled by an interactive user. In production, it is usually supervised by a service manager such as systemd.","Init is the first process started during OS boot on Unix-like systems. Modern Linux systems often use systemd as the init system and service manager.","Binding to `127.0.0.1` or `localhost` limits access to the local machine. Binding to `0.0.0.0` listens on all IPv4 interfaces and can expose the service to the network."],"examples":[{"title":"Address binding choice","body":"`(\"127.0.0.1\", 8000)` is good for local-only tools. `(\"0.0.0.0\", 8000)` is for services that must accept traffic from other machines and should be protected by firewall, auth, or network policy."},{"title":"Preflight failure","body":"If the database schema version is too old, preflight should fail before workers start, not after the first request hits a missing column."}],"mistakes":["Exposing a dev server on `0.0.0.0` without realizing other machines may reach it.","Using health checks that only prove the process exists, not that dependencies are ready.","Hiding config errors until the first real job runs."],"citations":["src-systemd-creds"]},{"id":"database-migrations","title":"Database Migration Safety","items":["A migration script records schema versions and applies controlled upgrade or downgrade steps so code and database structure stay compatible.","Migrations should run before code that depends on the new schema, or deployment should block until the schema version check passes.","Schema version checks prevent old code from running against new schema or new code from running against old schema.","Indexes should be added intentionally because they improve read paths but can slow writes, increase storage, and affect migration time.","Database integration tests should exercise migration paths, transactions, schema constraints, and rollback behavior where rollback is supported."],"examples":[{"title":"Migration failure mode","body":"A developer adds `users.last_login_at` in code but does not migrate production. The service crashes when it writes that field. A schema version check catches this at startup."}],"mistakes":["Treating migrations as optional helper scripts instead of release-critical artifacts.","Adding indexes without measuring the query they are meant to improve.","Testing only the final schema and never testing the upgrade path."],"citations":[]},{"id":"observability-prometheus","title":"Observability and Prometheus","items":["Observability means the system produces enough evidence to understand behavior without guessing: structured logs, metrics, status, error classes, and retry/dead-letter visibility.","Structured JSON logs make production logs easier to filter, aggregate, and connect to events.","Prometheus instrumentation libraries define four core metric types: counter, gauge, histogram, and summary.","A counter is cumulative and monotonically increasing except when it resets, such as on process restart. Use it for events like requests, completed tasks, and errors.","A gauge can go up or down. Use it for values like CPU usage, queue depth, memory usage, temperature, or current connection count.","A histogram samples observations into buckets and also exposes count and sum. Use it for latency and size distributions when bucketed analysis matters.","Prometheus normally pulls metrics by scraping targets. Exporters expose metrics; Prometheus scrapes, stores time series, and users query with PromQL or visualize in tools such as Grafana."],"examples":[{"title":"Choosing metric type","body":"Use a counter for `jobs_completed_total`, a gauge for `queue_depth`, and a histogram for `request_duration_seconds`."},{"title":"Correcting the rough note","body":"The rough note said metrics are pushed to Prometheus. The normal Prometheus model is pull-based scraping; exporters expose metrics for Prometheus to scrape."}],"mistakes":["Using a counter for a value that can decrease.","Logging every error but not counting errors by class or outcome.","Recording retries without visibility into dead-letter or final failure states."],"citations":["src-prometheus-metrics"]},{"id":"shell-editor-productivity","title":"Shell and Editor Productivity","items":["`grep` searches input for lines matching a pattern. Its name comes from the Unix editor command `g/re/p`, meaning global/regular expression/print.","`grep -i` ignores case when matching.","`grep -v` inverts the match and prints lines that do not match the pattern.","`grep -r` searches recursively through directories.","`grep -n` prints line numbers for matching lines.","Useful VS Code navigation shortcuts from the rough note: F12 for definition, Ctrl+T for symbol search, Ctrl+Shift+O for symbols in the current file, and Ctrl+Shift+F for text search across files."],"examples":[{"title":"Search for an error case-insensitively","body":"Find `error`, `ERROR`, and mixed-case variants in a log file.","code":"grep -i \"error\" server.log"},{"title":"Find a symbol recursively","body":"Search all files under a project folder for a variable or function name.","code":"grep -rn \"my_variable\" ./project_folder/"}],"mistakes":["Remembering `grep` as global regular expression point. The corrected expansion is print, from `g/re/p`.","Using recursive search without narrowing the folder, which can create noisy output.","Forgetting `-n` when you need actionable file locations."],"citations":["src-gnu-grep"]},{"id":"python-runtime-typing","title":"Python Runtime, Imports, and Typing","items":["`TYPE_CHECKING` from `typing` is treated as true by static type checkers but is false at runtime. Use it for imports needed only for type hints, especially expensive imports or imports that would create runtime cycles.","`from __future__ import annotations` postpones annotation evaluation in supported Python versions, so annotations can behave more like strings instead of immediately resolving names.","Mypy is a static type checker: it analyzes code for type errors without executing the program.","A type annotation does not create a value. A line such as `f_lst: dict[str, list[str]]` declares a type but still needs `= {}` before use.","Python object references live in stack frames or namespaces, while most Python objects live on the heap managed by the runtime.","`MyHandler()` creates an instance. `MyHandler` passes the class object itself, which is useful when an API expects a handler class rather than an instance.","`@staticmethod` is useful for helper behavior logically attached to a class but independent of instance state. Use a module-level function when the helper is general-purpose.","`try` / `except` / `else`: the `else` block runs only if the `try` block completes without raising an exception."],"examples":[{"title":"Type-only import","body":"Use `TYPE_CHECKING` when a type is only needed by the checker and importing it at runtime would be expensive or circular.","code":"from typing import TYPE_CHECKING\n\nif TYPE_CHECKING:\n    from app.jobs import JobRegistryEntry\n\ndef run(job: \"JobRegistryEntry\") -> None:\n    ..."},{"title":"Annotation plus initialization","body":"This creates a real dictionary value after declaring its type.","code":"groups: dict[str, list[str]] = {}"}],"mistakes":["Writing `from tying import TYPE_CHECKING`; the module is `typing`.","Assuming `TYPE_CHECKING` removes dependencies. It only prevents selected imports from running at runtime.","Calling a function immediately with `_connector.connect()` when the code needs to store the callable `_connector.connect` for later.","Using `@staticmethod` for a general utility that does not belong to the class domain."],"citations":["src-python-typing","src-python-future","src-mypy","src-python-datamodel"]},{"id":"release-discipline","title":"Release and Production Discipline","items":["Ratcheting means enforcing standards incrementally so the codebase can only move forward or avoid regression.","Linting scans code for suspicious patterns, style issues, and likely mistakes before runtime.","Coverage measures how much code is executed by tests. It is useful, but production confidence still depends on testing meaningful behavior and failure paths.","A principal-level release needs docs, runbook, backup/restore plan, rollback procedure, versioned artifacts, release notes, and performance baselines.","`PYTHONDONTWRITEBYTECODE=1` prevents Python from writing `.pyc` bytecode cache files. It can keep one-time CI or disposable runs cleaner, but repeated imports may lose some startup-cache benefit.","`PYTHONUNBUFFERED=1` makes output less buffered so logs appear faster, which is useful in containers and CI."],"examples":[{"title":"CI command from the rough note","body":"Run static type checks first, then execute tests under coverage.","code":"python -m mypy server_block && python -m coverage run -m unittest discover -s server_block/tests"},{"title":"Clean test run","body":"Run tests without writing bytecode cache files into the project tree.","code":"PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests"}],"mistakes":["Treating high coverage as proof that the important behavior is tested.","Shipping without a rollback procedure or runbook.","Using environment variables without documenting what enables or disables the behavior."],"citations":["src-mypy","src-systemd-creds"]}],"quickReview":["`pyproject.toml`: `[build-system]` for build backend/dependencies, `[project]` for package metadata, `[tool.*]` for tool configuration.","Preflight checks should fail early when config, credentials, schema, or dependencies are not ready.","Migrations make database schema changes explicit and versioned.","Prometheus normally pulls metrics from exporters; counters increase, gauges move up/down, histograms bucket observations.","`grep` comes from `g/re/p`: global/regular expression/print.","`TYPE_CHECKING` is false at runtime and true for static type checkers.","Mypy checks statically without running code.","`MyHandler()` creates an instance; `MyHandler` passes the class."],"citations":[{"id":"src-pyproject","label":"Python Packaging User Guide: Writing your pyproject.toml","url":"https://packaging.python.org/guides/writing-pyproject-toml/","note":"Verifies `pyproject.toml`, `[build-system]`, `[project]`, `[tool]`, and `[project.scripts]` behavior."},{"id":"src-prometheus-metrics","label":"Prometheus documentation: Metric types","url":"https://prometheus.io/docs/concepts/metric_types/","note":"Verifies counter, gauge, histogram, and summary semantics."},{"id":"src-gnu-grep","label":"GNU Grep manual","url":"https://www.gnu.org/s/grep/manual/grep.html","note":"Verifies `grep` behavior and the `g/re/p` origin."},{"id":"src-python-typing","label":"Python docs: typing.TYPE_CHECKING","url":"https://docs.python.org/3/library/typing.html#typing.TYPE_CHECKING","note":"Verifies that `TYPE_CHECKING` is false at runtime and assumed true by static type checkers."},{"id":"src-python-future","label":"Python docs: __future__ annotations","url":"https://docs.python.org/3/library/__future__.html","note":"Verifies the future annotations feature and postponed/deferred annotation behavior."},{"id":"src-mypy","label":"Mypy docs: Getting started","url":"https://mypy.readthedocs.io/en/stable/getting_started.html","note":"Verifies that mypy checks code statically without running it."},{"id":"src-python-datamodel","label":"Python docs: Data model descriptors","url":"https://docs.python.org/3/reference/datamodel.html","note":"Verifies staticmethod and classmethod descriptor behavior."},{"id":"src-systemd-creds","label":"systemd credentials documentation","url":"https://systemd.io/CREDENTIALS/","note":"Verifies encrypted credential concepts and credential handling context."}],"questions":[{"id":"tf-pyproject-build-system","question":"The `[build-system]` table declares the build backend and build-time dependencies needed to build a Python project.","sectionId":"python-packaging-quality","source":"Python Packaging and Quality Gates","testType":"tf","answer":true},{"id":"tf-type-checking-runtime","question":"`TYPE_CHECKING` is false at runtime but treated as true by static type checkers.","sectionId":"python-runtime-typing","source":"Python Runtime, Imports, and Typing","testType":"tf","answer":true},{"id":"tf-counter-decrease","question":"A Prometheus counter is a good metric type for values that frequently increase and decrease.","sectionId":"observability-prometheus","source":"Observability and Prometheus","testType":"tf","answer":false},{"id":"tf-grep-point","question":"`grep` comes from global regular expression point.","sectionId":"shell-editor-productivity","source":"Shell and Editor Productivity","testType":"tf","answer":false},{"id":"mcq-pyproject-tool","question":"Where should tool-specific config like mypy or ruff usually live in `pyproject.toml`?","sectionId":"python-packaging-quality","source":"Python Packaging and Quality Gates","testType":"mcq","options":{"A":"`[project]`","B":"`[tool.*]`","C":"`[build-system]`","D":"`[runtime]`"},"answer":"B"},{"id":"mcq-bind-address","question":"What does binding a Python server to `0.0.0.0` usually mean?","sectionId":"runtime-deployment-safety","source":"Runtime and Deployment Safety","testType":"mcq","options":{"A":"Only the current process can access it.","B":"Only the local machine can access it.","C":"It listens on all IPv4 interfaces.","D":"It disables IPv4 networking."},"answer":"C"},{"id":"mcq-handler-class","question":"If an API expects a handler class, which form should you pass?","sectionId":"python-runtime-typing","source":"Python Runtime, Imports, and Typing","testType":"mcq","options":{"A":"`MyHandler()` because it always creates the safest value.","B":"`MyHandler` because it passes the class object itself.","C":"`MyHandler.__init__()` because it initializes the class.","D":"`super(MyHandler)` because handlers must be inherited."},"answer":"B"},{"id":"mcq-gauge","question":"Which metric type should represent a queue depth that can go up or down?","sectionId":"observability-prometheus","source":"Observability and Prometheus","testType":"mcq","options":{"A":"Counter","B":"Summary only","C":"Gauge","D":"Release note"},"answer":"C"},{"id":"mcq-mypy","question":"What is the key behavior of mypy?","sectionId":"python-runtime-typing","source":"Python Runtime, Imports, and Typing","testType":"mcq","options":{"A":"It executes tests and reports runtime failures.","B":"It statically checks type errors without running the program.","C":"It formats Python code.","D":"It migrates database schema."},"answer":"B"},{"id":"mcq-preflight","question":"What is the main purpose of a preflight command?","sectionId":"runtime-deployment-safety","source":"Runtime and Deployment Safety","testType":"mcq","options":{"A":"Run after the service is already serving traffic.","B":"Check readiness conditions before startup or deployment continues.","C":"Replace database migrations.","D":"Hide configuration errors from users."},"answer":"B"},{"id":"completion-project-table","question":"Which `pyproject.toml` table stores standardized package metadata such as name, version, and dependencies?","sectionId":"python-packaging-quality","source":"Python Packaging and Quality Gates","testType":"completion","answerText":"[project]","acceptedAnswers":["[project]","project"]},{"id":"completion-grep-ignore-case","question":"Which `grep` flag ignores case?","sectionId":"shell-editor-productivity","source":"Shell and Editor Productivity","testType":"completion","answerText":"-i","acceptedAnswers":["-i","i"]},{"id":"completion-prometheus-counter","question":"Which Prometheus metric type should count events that only increase except for resets?","sectionId":"observability-prometheus","source":"Observability and Prometheus","testType":"completion","answerText":"counter","acceptedAnswers":["counter","Counter"]},{"id":"completion-type-checking","question":"Which constant lets imports run for type checkers but not at runtime?","sectionId":"python-runtime-typing","source":"Python Runtime, Imports, and Typing","testType":"completion","answerText":"TYPE_CHECKING","acceptedAnswers":["TYPE_CHECKING","typing.TYPE_CHECKING"]},{"id":"written-migration-purpose","question":"Explain why a migration script matters during package or service updates.","sectionId":"database-migrations","source":"Database Migration Safety","testType":"written","modelAnswerText":"A migration script makes schema changes explicit and versioned. It upgrades or downgrades the database so the running code and database structure remain compatible. It should run before code that depends on the new schema or block startup through a schema version check.","keywords":["schema","version","compatible","upgrade","startup"]},{"id":"written-prometheus-flow","question":"Describe the normal Prometheus metrics flow from application to dashboard.","sectionId":"observability-prometheus","source":"Observability and Prometheus","testType":"written","modelAnswerText":"The application or exporter exposes metrics. Prometheus scrapes the target on a schedule, stores the samples as time series, users query the data with PromQL, and dashboards such as Grafana visualize the results.","keywords":["exporter","scrapes","time series","PromQL","dashboard"]},{"id":"written-type-only-import","question":"When would you use `if TYPE_CHECKING:` around an import?","sectionId":"python-runtime-typing","source":"Python Runtime, Imports, and Typing","testType":"written","modelAnswerText":"Use it when the imported object is only needed for type hints and importing it at runtime would be expensive, optional, or would create a circular import. Static type checkers still see the import, but runtime code avoids it.","keywords":["type hints","runtime","circular","expensive","static"]},{"id":"written-quality-gate","question":"Design a compact `check.sh` quality gate for this kind of Python service.","sectionId":"release-discipline","source":"Release and Production Discipline","testType":"written","modelAnswerText":"A good quality gate runs format check, linting, mypy, tests, coverage, package build, install smoke test, and optionally dependency audit and compile checks. It should fail fast and be used before release or CI merge.","keywords":["format","lint","mypy","tests","coverage","build"]}],"highlights":[]}</script>
  <script>
  (() => {
    "use strict";

    // Data loading and state
    const rawData = document.getElementById("notion-notes-data").textContent;
    const data = JSON.parse(rawData);
    const pageId = slugify(data.metadata?.title || "notion-notes");
    const expectedJsonFileName = resolveExpectedJsonFileName();
    const contentVersion = hashText(JSON.stringify({
      title: data.metadata?.title || "",
      summary: data.summary || [],
      sections: data.sections || [],
      quickReview: data.quickReview || []
    }));
    const highlightKey = `notion-notes:${pageId}:${contentVersion}:selection-highlights`;
    const answersKey = `notion-notes:${pageId}:answers`;
    const highlightsPanelKey = `notion-notes:${pageId}:highlights-panel-open`;
    const jsonFileHandleKey =
      `notion-notes:${pageId}:${expectedJsonFileName || "notes-json"}:json-file-handle`;
    const dataHighlights = normalizeStoredHighlights(data.highlights || []);
    let highlightRanges = dataHighlights.length
      ? dataHighlights
      : normalizeStoredHighlights(loadJson(highlightKey, []));
    let savedAnswers = loadJson(answersKey, {});
    let lastResults = {};
    let revealAll = false;
    let baseScopeHtml = new Map();
    let currentSelection = null;
    let lastPointer = null;
    let highlightsPanelOpen = loadSessionBool(highlightsPanelKey, false);
    let jsonFileHandle = null;
    let jsonSaveTimer = null;
    let jsonSaveReady = false;
    let matchingJsonReadReady = false;

    // Static DOM references
    const root = document.getElementById("notes-root");
    const toc = document.getElementById("toc");
    const selectionToolbar = document.getElementById("selection-toolbar");
    const highlightsTab = document.getElementById("highlights-tab");
    const highlightsPanel = document.getElementById("highlights-panel");
    const highlightsClose = document.getElementById("highlights-close");
    const highlightsPanelBody = document.getElementById("highlights-panel-body");
    const highlightsPanelCount = document.getElementById("highlights-panel-count");
    const jsonConnectPanel = document.getElementById("json-connect-panel");
    const jsonConnectButton = document.getElementById("json-connect-button");
    const jsonConnectMessage = document.getElementById("json-connect-message");
    const sectionTitleByScope = buildSectionTitleByScope();

    // Utilities
    function slugify(value) {
      return String(value || "section")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "") || "section";
    }

    function hashText(value) {
      let hash = 5381;
      for (let i = 0; i < value.length; i += 1) {
        hash = ((hash << 5) + hash) ^ value.charCodeAt(i);
      }
      return (hash >>> 0).toString(36);
    }

    function loadJson(key, fallback) {
      try {
        const stored = localStorage.getItem(key);
        return stored ? JSON.parse(stored) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        /* Storage may be unavailable in strict browser modes. */
      }
    }

    function loadSessionBool(key, fallback) {
      try {
        const stored = sessionStorage.getItem(key);
        return stored == null ? fallback : stored === "true";
      } catch {
        return fallback;
      }
    }

    function saveSessionBool(key, value) {
      try {
        sessionStorage.setItem(key, String(value));
      } catch {
        /* Session storage may be unavailable in strict browser modes. */
      }
    }

    function supportsJsonFileSave() {
      // File System Access API support is required for direct JSON save-back.
      return Boolean(window.showOpenFilePicker && window.indexedDB);
    }

    function resolveExpectedJsonFileName() {
      const meta = data.metadata || {};
      return fileNameOnly(meta.jsonFileName) ||
        jsonFileNameFromHtml(meta.htmlFileName) ||
        jsonFileNameFromHtml(currentHtmlFileName());
    }

    function currentHtmlFileName() {
      try {
        const parts = String(window.location?.pathname || "").split("/");
        return decodeURIComponent(parts.pop() || "");
      } catch {
        return "";
      }
    }

    function fileNameOnly(value) {
      return String(value || "").split(/[\\/]/).pop().trim();
    }

    function jsonFileNameFromHtml(value) {
      const fileName = fileNameOnly(value);
      if (!fileName) return "";
      if (/\.html?$/i.test(fileName)) {
        return fileName.replace(/\.html?$/i, ".json");
      }
      const dotIndex = fileName.lastIndexOf(".");
      const baseName = dotIndex > 0 ? fileName.slice(0, dotIndex) : fileName;
      return baseName ? `${baseName}.json` : "";
    }

    function handleMatchesExpectedJson(handle) {
      return !expectedJsonFileName || handle?.name === expectedJsonFileName;
    }

    function expectedJsonText() {
      return expectedJsonFileName
        ? `<strong>${escapeHtml(expectedJsonFileName)}</strong>`
        : "the notes JSON";
    }

    function canFetchMatchingJson() {
      return Boolean(
        expectedJsonFileName &&
        ["http:", "https:"].includes(window.location.protocol)
      );
    }

    // IndexedDB stores the user-approved JSON file handle between sessions.
    function openHandleStore(mode = "readonly") {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("notion-notes-file-handles", 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore("handles");
        };
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          const db = request.result;
          const transaction = db.transaction("handles", mode);
          transaction.oncomplete = () => db.close();
          transaction.onerror = () => {
            const error = transaction.error;
            db.close();
            reject(error);
          };
          resolve(transaction.objectStore("handles"));
        };
      });
    }

    async function loadJsonFileHandle() {
      if (!supportsJsonFileSave()) return null;
      try {
        const store = await openHandleStore();
        return await new Promise((resolve, reject) => {
          const request = store.get(jsonFileHandleKey);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result || null);
        });
      } catch {
        return null;
      }
    }

    async function saveJsonFileHandle(handle) {
      const store = await openHandleStore("readwrite");
      await new Promise((resolve, reject) => {
        const request = store.put(handle, jsonFileHandleKey);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve();
      });
    }

    async function clearJsonFileHandle() {
      const store = await openHandleStore("readwrite");
      await new Promise((resolve, reject) => {
        const request = store.delete(jsonFileHandleKey);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve();
      });
    }

    async function hasWritePermission(handle) {
      if (!handle) return false;
      const options = { mode: "readwrite" };
      if ((await handle.queryPermission(options)) === "granted") return true;
      return (await handle.requestPermission(options)) === "granted";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderInline(value) {
      return escapeHtml(value).replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function renderList(items, className) {
      if (!items || !items.length) return "";
      return `<ul class="${className}">` +
        items.map((item) => `<li>${renderInline(item)}</li>`).join("") +
        "</ul>";
    }

    function renderCallouts(items, type) {
      if (!items || !items.length) return "";
      const className = type === "command" ? "callout command" : "callout";
      const fallbackTitle = type === "command" ? "Snippet" : "Example";
      return `<div class="callout-grid">${items.map((item) => `
        <figure class="${className}">
          <h4>${escapeHtml(item.title || fallbackTitle)}</h4>
          ${item.body ? `<p>${renderInline(item.body)}</p>` : ""}
          ${item.code ? `<pre><code>${escapeHtml(item.code)}</code></pre>` : ""}
        </figure>
      `).join("")}</div>`;
    }

    function renderCitations(ids) {
      if (!ids || !ids.length) return "";
      const links = ids
        .map((id) => `<a href="#source-${escapeHtml(id)}">${escapeHtml(id)}</a>`)
        .join(", ");
      return `<p class="source-tag">Sources: ${links}</p>`;
    }

    // Data rendering
    function buildSectionTitleByScope() {
      const titles = new Map([
        ["summary", "Executive summary"],
        ["quick-review", "Quick review"]
      ]);
      for (const section of data.sections || []) {
        titles.set(section.id, section.title || section.id);
      }
      return titles;
    }

    function buildMeta() {
      const meta = data.metadata || {};
      document.getElementById("page-title").textContent = meta.title || "Notion Notes";
      document.getElementById("page-meta").innerHTML = [
        meta.sourceTitle ? `<span class="pill">Source: ${escapeHtml(meta.sourceTitle)}</span>` : "",
        meta.factCheckMode ? `<span class="pill">Fact check: ${escapeHtml(meta.factCheckMode)}</span>` : "",
        meta.generatedAt ? `<span class="pill">Generated: ${escapeHtml(meta.generatedAt)}</span>` : ""
      ].filter(Boolean).join("");
    }

    function buildToc() {
      const links = [
        ["summary", "Executive summary"],
        ...((data.sections || []).map((section) => [section.id, section.title])),
        ["quick-review", "Quick review"],
        ["test-section", "Interactive test"],
        ["sources", "Sources"]
      ];
      toc.innerHTML = links
        .map(([id, label]) => `<a href="#${escapeHtml(id)}">${escapeHtml(label)}</a>`)
        .join("");
    }

    function renderNotes() {
      const sections = [];
      sections.push(`
        <section class="section" id="summary">
          <h2>Executive summary</h2>
          <div class="article-body" data-highlight-scope="summary">
            ${renderList(data.summary || [], "summary-list")}
          </div>
        </section>
      `);
      for (const section of data.sections || []) {
        sections.push(`
          <section class="section" id="${escapeHtml(section.id)}">
            <h2>${escapeHtml(section.title)}</h2>
            <div class="article-body" data-highlight-scope="${escapeHtml(section.id)}">
              ${renderList(section.items || [], "article-list")}
              ${renderCallouts(section.examples || [], "example")}
              ${(section.commands || []).length
                ? `<h3>Commands and snippets</h3>${renderCallouts(section.commands, "command")}`
                : ""}
              ${(section.mistakes || []).length
                ? `<h3>Common mistakes</h3>${renderList(section.mistakes, "mistake-list")}`
                : ""}
              ${renderCitations(section.citations || [])}
            </div>
          </section>
        `);
      }
      sections.push(`
        <section class="section" id="quick-review">
          <h2>Quick review</h2>
          <div class="article-body" data-highlight-scope="quick-review">
            ${renderList(data.quickReview || [], "review-list")}
          </div>
        </section>
      `);
      sections.push(renderTest());
      sections.push(renderSources());
      root.innerHTML = sections.join("");
      setupSelectionHighlights();
      wireTest();
      restoreAnswers();
      renderStats();
    }

    function groupQuestions() {
      const labels = {
        tf: "True / False",
        mcq: "Multiple Choice",
        completion: "Completion",
        written: "Written / Practical"
      };
      return ["tf", "mcq", "completion", "written"].map((type) => ({
        type,
        label: labels[type],
        questions: (data.questions || []).filter((question) => question.testType === type)
      })).filter((group) => group.questions.length);
    }

    function renderTest() {
      const groups = groupQuestions();
      return `
        <section class="section" id="test-section">
          <h2>End-of-chapter exercises</h2>
          <p class="exercise-note">
            Work through the questions, reveal individual answers when needed,
            then check the attempt when you want scoring and weak-topic
            feedback.
          </p>
          <div class="test-controls">
            <button type="button" class="primary" id="check-test">Check / Save Attempt</button>
            <button type="button" id="shuffle-all">Shuffle all</button>
            <button type="button" id="reveal-answers" aria-pressed="false">Reveal all answers</button>
            <button type="button" id="reset-test">Reset answers</button>
            <button type="button" id="print-wrong">Print wrong questions</button>
          </div>
          <div id="test-groups">
            ${groups.map((group) => `
              <section class="test-group" data-group="${group.type}">
                <h3>${escapeHtml(group.label)}</h3>
                <button
                  type="button"
                  class="shuffle-section"
                  data-shuffle-section="${group.type}"
                >
                  Shuffle section
                </button>
                <div class="question-list">
                  ${group.questions.map(renderQuestion).join("")}
                </div>
              </section>
            `).join("")}
          </div>
          <div class="stats" id="stats" role="status" aria-live="polite"></div>
          <div class="wrong-list" id="wrong-list" role="status" aria-live="polite"></div>
        </section>
      `;
    }

    function renderQuestion(question) {
      const panelId = `answer-${question.id}`;
      return `
        <article
          class="question"
          data-qid="${escapeHtml(question.id)}"
          data-section="${escapeHtml(question.sectionId || "")}"
          data-source="${escapeHtml(question.source || "")}"
        >
          <div class="q-meta">
            ${escapeHtml(question.source || question.sectionId || "General")}
            | ${escapeHtml(question.testType.toUpperCase())}
          </div>
          <p><strong>${renderInline(question.question)}</strong></p>
          ${renderQuestionInput(question)}
          <button
            type="button"
            class="answer-toggle"
            aria-expanded="false"
            aria-controls="${escapeHtml(panelId)}"
          >
            Show Answer
          </button>
          <div class="manual-controls hidden">
            <button type="button" class="manual-correct">Mark correct</button>
            <button type="button" class="manual-wrong">Mark wrong</button>
          </div>
          <div class="answer-panel" id="${escapeHtml(panelId)}" hidden>
            ${renderAnswer(question)}
          </div>
        </article>
      `;
    }

    function renderQuestionInput(question) {
      if (question.testType === "tf") {
        return ["true", "false"].map((value) => (
          `<label class="option">` +
          `<input type="radio" name="${escapeHtml(question.id)}" value="${value}"> ` +
          `${value === "true" ? "True" : "False"}` +
          "</label>"
        )).join("");
      }
      if (question.testType === "mcq") {
        return Object.entries(question.options || {}).map(([key, value]) => (
          `<label class="option">` +
          `<input type="radio" name="${escapeHtml(question.id)}" value="${escapeHtml(key)}"> ` +
          `${escapeHtml(key)}. ${renderInline(value)}` +
          "</label>"
        )).join("");
      }
      if (question.testType === "completion") {
        return `<input type="text" data-answer-input="${escapeHtml(question.id)}" placeholder="Type your answer">`;
      }
      return `<textarea data-answer-input="${escapeHtml(question.id)}" ` +
        `placeholder="Write your explanation or command"></textarea>`;
    }

    function renderAnswer(question) {
      if (question.testType === "mcq") {
        const answerText = question.options?.[question.answer] || "";
        return `<strong>Answer:</strong> ${escapeHtml(question.answer)}. ${renderInline(answerText)}`;
      }
      if (question.testType === "tf") {
        return `<strong>Answer:</strong> ${question.answer === true || question.answer === "true" ? "True" : "False"}`;
      }
      if (question.testType === "completion") {
        const answerText = question.answerText ||
          (question.acceptedAnswers || []).join(", ");
        return `<strong>Answer:</strong> ${renderInline(answerText)}`;
      }
      return `<strong>Model answer:</strong> ${renderInline(question.modelAnswerText || "")}`;
    }

    function renderSources() {
      const citations = data.citations || [];
      return `
        <section class="section" id="sources">
          <h2>Sources</h2>
          ${citations.length ? `<ol class="sources-list">${citations.map((source) => `
            <li id="source-${escapeHtml(source.id)}">
              <a href="${escapeHtml(source.url)}">${escapeHtml(source.label || source.id)}</a>
              ${source.note ? ` - ${renderInline(source.note)}` : ""}
            </li>
          `).join("")}</ol>` : "<p>No external sources recorded.</p>"}
        </section>
      `;
    }

    // Highlighting and JSON persistence
    function setupSelectionHighlights() {
      baseScopeHtml = new Map();
      document.querySelectorAll("[data-highlight-scope]").forEach((scope) => {
        baseScopeHtml.set(scope.dataset.highlightScope, scope.innerHTML);
      });
      renderStoredHighlights();

      selectionToolbar.addEventListener("mousedown", (event) => {
        event.preventDefault();
      });
      selectionToolbar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-highlight-action]");
        if (!button || !currentSelection) return;
        if (button.dataset.highlightAction === "clear") {
          clearSelectionHighlight(currentSelection);
        } else {
          addSelectionHighlight(currentSelection, button.dataset.highlightAction);
        }
        hideSelectionToolbar();
        window.getSelection()?.removeAllRanges();
      });
      document.addEventListener("selectionchange", scheduleSelectionToolbar);
      window.addEventListener("resize", hideSelectionToolbar);
      document.addEventListener(
        "pointermove",
        updatePointerPosition,
        { passive: true }
      );
      document.addEventListener(
        "pointerdown",
        updatePointerPosition,
        { passive: true }
      );
      document.addEventListener("mousedown", (event) => {
        if (!selectionToolbar.contains(event.target)) hideSelectionToolbar();
      });
    }

    function renderHighlightsPanel() {
      updateHighlightsPanel();
      toggleHighlightsPanel(highlightsPanelOpen, { persist: false });
    }

    function setupHighlightsPanel() {
      highlightsTab.addEventListener("click", () => toggleHighlightsPanel(true));
      highlightsClose.addEventListener("click", () => toggleHighlightsPanel(false));
      jsonConnectButton.textContent = expectedJsonFileName ? "Connect matching JSON" : "Connect JSON";
      jsonConnectButton.addEventListener("click", connectJsonFile);
      highlightsPanelBody.addEventListener("click", (event) => {
        const card = event.target.closest("[data-highlight-jump]");
        if (!card) return;
        scrollToHighlight(card.dataset.highlightJump);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && highlightsPanelOpen) {
          toggleHighlightsPanel(false);
        }
      });
      initializeJsonFileSave();
    }

    async function initializeJsonFileSave() {
      if (!supportsJsonFileSave()) {
        jsonSaveReady = false;
        updateJsonConnectPrompt();
        return;
      }
      jsonFileHandle = await loadJsonFileHandle();
      if (jsonFileHandle && !handleMatchesExpectedJson(jsonFileHandle)) {
        try {
          await clearJsonFileHandle();
        } catch {
          /* A stale handle can be ignored even when IndexedDB cleanup fails. */
        }
        jsonFileHandle = null;
      }
      if (jsonFileHandle) {
        try {
          jsonSaveReady = await hasWritePermission(jsonFileHandle);
        } catch {
          jsonSaveReady = false;
        }
      }
      updateJsonConnectPrompt();
    }

    async function initializeMatchingJsonRead() {
      if (!canFetchMatchingJson()) {
        updateJsonConnectPrompt();
        return;
      }
      try {
        const response = await fetch(
          new URL(expectedJsonFileName, window.location.href),
          { cache: "no-store" }
        );
        if (!response.ok) {
          updateJsonConnectPrompt();
          return;
        }
        const matchingData = await response.json();
        matchingJsonReadReady = true;
        const fetchedHighlights = normalizeStoredHighlights(matchingData.highlights || []);
        if (fetchedHighlights.length) {
          highlightRanges = fetchedHighlights;
          saveJson(highlightKey, highlightRanges);
          renderStoredHighlights();
        }
        updateJsonConnectPrompt();
        updateHighlightsPanel();
      } catch {
        updateJsonConnectPrompt();
      }
    }

    async function connectJsonFile() {
      if (!supportsJsonFileSave()) {
        jsonSaveReady = false;
        updateJsonConnectPrompt("Open this page in Chrome or Edge to connect the notes JSON file.");
        return;
      }
      try {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: "Notes JSON",
            accept: { "application/json": [".json"] }
          }]
        });
        if (!handleMatchesExpectedJson(handle)) {
          jsonSaveReady = false;
          const chosen = handle?.name ? ` You chose ${handle.name}.` : "";
          updateJsonConnectPrompt(
            `Choose ${expectedJsonFileName}.${chosen} ` +
            "This page will not connect to a different JSON file."
          );
          return;
        }
        if (!handle || !(await hasWritePermission(handle))) {
          jsonSaveReady = false;
          updateJsonConnectPrompt("Permission was not granted. Connect the JSON file to save highlights.");
          return;
        }
        jsonFileHandle = handle;
        try {
          await saveJsonFileHandle(handle);
        } catch {
          /* Some browser modes cannot persist handles; the current session can still save. */
        }
        jsonSaveReady = true;
        updateJsonConnectPrompt();
        updateHighlightsPanel();
        scheduleHighlightJsonSave();
      } catch (error) {
        if (error?.name !== "AbortError") {
          updateJsonConnectPrompt("Could not connect the JSON file. Try choosing it again.");
        }
      }
    }

    function updateJsonConnectPrompt(message) {
      if (!jsonConnectPanel) return;
      if (jsonSaveReady) {
        jsonConnectPanel.hidden = true;
        updateHighlightsPanel();
        return;
      }
      jsonConnectPanel.hidden = false;
      jsonConnectButton.hidden = !supportsJsonFileSave();
      jsonConnectMessage.innerHTML = message ? escapeHtml(message) : (
        supportsJsonFileSave()
          ? `${matchingJsonReadReady ? `Read ${expectedJsonText()} for saved highlights. ` : ""}` +
            `Connect ${expectedJsonText()} once so highlight changes can save into it.`
          : `Expected JSON: ${expectedJsonText()}. Open this page in Chrome or Edge to save highlights into it.`
      );
    }

    function updateHighlightsPanel() {
      if (!highlightsPanelBody) return;
      const colors = [
        ["green", "Green"],
        ["yellow", "Yellow"],
        ["red", "Red"]
      ];
      const validHighlights = highlightRanges.filter((item) => ["green", "yellow", "red"].includes(item.color));
      const jsonStatus = expectedJsonFileName
        ? (
          jsonSaveReady
            ? `saving to ${expectedJsonFileName}`
            : `${matchingJsonReadReady ? "read" : "expected"} ${expectedJsonFileName}`
        )
        : "JSON not matched";
      highlightsPanelCount.textContent = `${validHighlights.length} saved | ${jsonStatus}`;
      if (!validHighlights.length) {
        highlightsPanelBody.innerHTML =
          `<p class="highlights-empty">` +
          "No highlights yet. Select text to save review points." +
          "</p>";
        return;
      }
      highlightsPanelBody.innerHTML = colors.map(([color, label]) => {
        const items = validHighlights.filter((item) => item.color === color);
        if (!items.length) return "";
        return `
          <section class="highlight-group">
            <h3>${label} <span class="highlight-group-count">${items.length}</span></h3>
            <div class="highlight-list">
              ${items.map((item) => `
                <button
                  type="button"
                  class="highlight-card ${escapeHtml(color)}"
                  data-highlight-jump="${escapeHtml(item.id)}"
                >
                  <span class="highlight-card-text">${renderHighlightExcerpt(item.text)}</span>
                  <span class="highlight-card-source">
                    ${escapeHtml(sectionTitleByScope.get(item.scopeId) || item.scopeId || "Notes")}
                  </span>
                </button>
              `).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function scheduleHighlightJsonSave() {
      saveJson(highlightKey, highlightRanges);
      if (!jsonSaveReady || !jsonFileHandle) {
        updateJsonConnectPrompt();
        return;
      }
      window.clearTimeout(jsonSaveTimer);
      jsonSaveTimer = window.setTimeout(saveHighlightsToJson, 400);
    }

    async function saveHighlightsToJson() {
      if (!jsonSaveReady || !jsonFileHandle) return;
      try {
        if (!(await hasWritePermission(jsonFileHandle))) {
          jsonSaveReady = false;
          updateJsonConnectPrompt("Reconnect the notes JSON file to continue saving highlights.");
          return;
        }
        const writable = await jsonFileHandle.createWritable();
        await writable.write(JSON.stringify(buildUpdatedNotesJson(), null, 2));
        await writable.close();
        updateJsonConnectPrompt();
      } catch {
        jsonSaveReady = false;
        updateJsonConnectPrompt("Could not save to the JSON file. Reconnect it to continue saving highlights.");
      }
    }

    function buildUpdatedNotesJson() {
      return {
        ...data,
        highlights: serializeHighlights()
      };
    }

    function serializeHighlights() {
      const now = new Date().toISOString();
      return highlightRanges.map((item) => ({
        id: item.id,
        color: item.color,
        text: String(item.text || "").trim(),
        scopeId: item.scopeId,
        sectionTitle: sectionTitleByScope.get(item.scopeId) || item.scopeId || "Notes",
        start: item.start,
        end: item.end,
        createdAt: item.createdAt || now,
        updatedAt: now
      }));
    }

    function renderHighlightExcerpt(value) {
      const text = String(value || "").trim().replace(/\s+/g, " ");
      const excerpt = text.length > 220 ? `${text.slice(0, 217)}...` : text;
      return renderInline(excerpt || "Untitled highlight");
    }

    function toggleHighlightsPanel(open, options = {}) {
      highlightsPanelOpen = Boolean(open);
      document.body.classList.toggle("highlights-panel-open", highlightsPanelOpen);
      highlightsPanel.setAttribute("aria-hidden", String(!highlightsPanelOpen));
      highlightsTab.setAttribute("aria-expanded", String(highlightsPanelOpen));
      if (options.persist !== false) {
        saveSessionBool(highlightsPanelKey, highlightsPanelOpen);
      }
    }

    function scrollToHighlight(id) {
      const marks = Array.from(document.querySelectorAll(`[data-highlight-id="${cssEscape(id)}"]`));
      const target = marks.find((mark) => mark.textContent.trim()) || marks[0];
      if (!target) {
        updateHighlightsPanel();
        return;
      }
      toggleHighlightsPanel(false);
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("reader-highlight-focus");
      window.requestAnimationFrame(() => {
        target.classList.add("reader-highlight-focus");
        window.setTimeout(() => target.classList.remove("reader-highlight-focus"), 1500);
      });
    }

    function updatePointerPosition(event) {
      lastPointer = { x: event.clientX, y: event.clientY };
    }

    function scheduleSelectionToolbar() {
      window.requestAnimationFrame(() => {
        const info = getSelectionInfo();
        if (info) {
          currentSelection = info;
          showSelectionToolbar(info);
        } else if (!selectionToolbar.matches(":hover")) {
          hideSelectionToolbar();
        }
      });
    }

    function getSelectionInfo() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
      const range = selection.getRangeAt(0);
      const selectedText = range.toString();
      if (!selectedText.trim()) return null;
      const startScope = closestScope(range.startContainer);
      const endScope = closestScope(range.endContainer);
      if (!startScope || startScope !== endScope) return null;
      const scopeId = startScope.dataset.highlightScope;
      const start = getTextOffset(startScope, range.startContainer, range.startOffset);
      const end = getTextOffset(startScope, range.endContainer, range.endOffset);
      if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
      const rect = range.getBoundingClientRect();
      if (!rect.width && !rect.height) return null;
      return { scopeId, start, end, text: selectedText, rect };
    }

    function closestScope(node) {
      const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
      return element?.closest?.("[data-highlight-scope]") || null;
    }

    function getTextOffset(scope, container, offset) {
      const probe = document.createRange();
      probe.setStart(scope, 0);
      try {
        probe.setEnd(container, offset);
      } catch {
        return NaN;
      }
      return probe.toString().length;
    }

    function showSelectionToolbar(info) {
      const gap = 22;
      const edgePadding = 10;
      selectionToolbar.hidden = false;
      const toolbarRect = selectionToolbar.getBoundingClientRect();
      const toolbarWidth = toolbarRect.width || 320;
      const toolbarHeight = toolbarRect.height || 44;
      const midpoint = info.rect.left + info.rect.width / 2;
      let left = midpoint - toolbarWidth / 2;
      let top = info.rect.top - toolbarHeight - gap;

      if (top < edgePadding) {
        top = info.rect.bottom + gap;
      }

      left = Math.min(
        Math.max(left, edgePadding),
        window.innerWidth - toolbarWidth - edgePadding
      );
      top = Math.min(
        Math.max(top, edgePadding),
        window.innerHeight - toolbarHeight - edgePadding
      );

      if (
        lastPointer &&
        rectContainsPoint(
          left,
          top,
          toolbarWidth,
          toolbarHeight,
          lastPointer.x,
          lastPointer.y,
          gap
        )
      ) {
        const shiftedRight = Math.min(
          lastPointer.x + gap,
          window.innerWidth - toolbarWidth - edgePadding
        );
        const shiftedLeft = Math.max(lastPointer.x - toolbarWidth - gap, edgePadding);
        left = lastPointer.x < window.innerWidth / 2 ? shiftedRight : shiftedLeft;
      }

      selectionToolbar.style.left = `${left}px`;
      selectionToolbar.style.top = `${top}px`;
    }

    function rectContainsPoint(left, top, width, height, x, y, padding) {
      return x >= left - padding &&
        x <= left + width + padding &&
        y >= top - padding &&
        y <= top + height + padding;
    }

    function hideSelectionToolbar() {
      selectionToolbar.hidden = true;
      currentSelection = null;
    }

    function normalizeStoredHighlights(value) {
      if (!Array.isArray(value)) return [];
      return value.filter((item) => (
        item &&
        typeof item.scopeId === "string" &&
        Number.isFinite(item.start) &&
        Number.isFinite(item.end) &&
        item.end > item.start &&
        ["green", "yellow", "red"].includes(item.color)
      )).map((item) => ({
        ...item,
        id: item.id || randomId()
      }));
    }

    function randomId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return `h-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function addSelectionHighlight(selection, color) {
      const scope = document.querySelector(`[data-highlight-scope="${cssEscape(selection.scopeId)}"]`);
      const text = scope ? scope.textContent.slice(selection.start, selection.end) : selection.text;
      highlightRanges = highlightRanges.flatMap((item) => subtractHighlight(
        item,
        selection.scopeId,
        selection.start,
        selection.end
      ));
      highlightRanges.push({
        id: randomId(),
        scopeId: selection.scopeId,
        start: selection.start,
        end: selection.end,
        color,
        text,
        createdAt: new Date().toISOString()
      });
      saveHighlightRanges({ persistJson: true });
      renderStoredHighlights();
    }

    function clearSelectionHighlight(selection) {
      highlightRanges = highlightRanges.flatMap((item) => subtractHighlight(
        item,
        selection.scopeId,
        selection.start,
        selection.end
      ));
      saveHighlightRanges({ persistJson: true });
      renderStoredHighlights();
    }

    function subtractHighlight(item, scopeId, start, end) {
      if (item.scopeId !== scopeId || item.end <= start || item.start >= end) return [item];
      const pieces = [];
      if (item.start < start) {
        pieces.push({ ...item, id: randomId(), end: start });
      }
      if (item.end > end) {
        pieces.push({ ...item, id: randomId(), start: end });
      }
      return pieces;
    }

    function saveHighlightRanges(options = {}) {
      highlightRanges = highlightRanges
        .filter((item) => item.end > item.start)
        .sort((a, b) => a.scopeId.localeCompare(b.scopeId) || a.start - b.start);
      saveJson(highlightKey, highlightRanges);
      if (options.persistJson) {
        scheduleHighlightJsonSave();
      }
    }

    function renderStoredHighlights() {
      const previousLength = highlightRanges.length;
      document.querySelectorAll("[data-highlight-scope]").forEach((scope) => {
        const scopeId = scope.dataset.highlightScope;
        if (baseScopeHtml.has(scopeId)) {
          scope.innerHTML = baseScopeHtml.get(scopeId);
        }
      });
      const valid = [];
      for (const item of highlightRanges) {
        const scope = document.querySelector(`[data-highlight-scope="${cssEscape(item.scopeId)}"]`);
        if (!scope || item.start >= scope.textContent.length) continue;
        const clipped = { ...item, end: Math.min(item.end, scope.textContent.length) };
        if (clipped.end <= clipped.start) continue;
        wrapRangeByOffsets(scope, clipped);
        valid.push(clipped);
      }
      highlightRanges = valid;
      saveJson(highlightKey, highlightRanges);
      updateHighlightsPanel();
      if (valid.length !== previousLength) {
        scheduleHighlightJsonSave();
      }
    }

    function wrapRangeByOffsets(scope, highlight) {
      // Offset restoration lets saved JSON highlights survive page reloads.
      const textNodes = [];
      const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
      let offset = 0;
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const length = node.nodeValue.length;
        const nodeStart = offset;
        const nodeEnd = offset + length;
        if (nodeEnd > highlight.start && nodeStart < highlight.end) {
          textNodes.push({
            node,
            start: Math.max(0, highlight.start - nodeStart),
            end: Math.min(length, highlight.end - nodeStart)
          });
        }
        offset = nodeEnd;
        if (offset >= highlight.end) break;
      }
      textNodes
        .reverse()
        .forEach((entry) => wrapTextSegment(
          entry.node,
          entry.start,
          entry.end,
          highlight
        ));
    }

    function wrapTextSegment(textNode, start, end, highlight) {
      if (end <= start || !textNode.parentNode) return;
      let selected = textNode;
      if (end < selected.nodeValue.length) {
        selected.splitText(end);
      }
      if (start > 0) {
        selected = selected.splitText(start);
      }
      const mark = document.createElement("mark");
      mark.className = `reader-highlight reader-highlight-${highlight.color}`;
      const domId = highlightDomId(highlight.id);
      if (!document.getElementById(domId)) {
        mark.id = domId;
      }
      mark.dataset.highlightId = highlight.id;
      selected.parentNode.insertBefore(mark, selected);
      mark.appendChild(selected);
    }

    function highlightDomId(id) {
      return `highlight-${String(id).replace(/[^a-zA-Z0-9_-]/g, "-")}`;
    }

    // Test behavior
    function wireTest() {
      document.getElementById("check-test").addEventListener("click", checkTest);
      document.getElementById("shuffle-all").addEventListener("click", () => {
        document.querySelectorAll(".question-list").forEach(shuffleChildren);
      });
      document.querySelectorAll(".shuffle-section").forEach((button) => {
        button.addEventListener("click", () => shuffleChildren(
